name: Deploy to Firebase App Hosting

on:
  push:
    branches:
      - development # Or the branch you want to trigger deploys from
  workflow_dispatch: {} # This allows you to trigger the workflow manually from the GitHub Actions tab

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Use a Node.js version compatible with your project and Firebase CLI

      - name: Install Firebase CLI
        run: npm install -g firebase-tools # Install globally or ensure it's in your project's dependencies

      - name: Install project dependencies
        run: npm install # Or yarn install, pnpm install, etc.

      # Optional: Build your application if needed (e.g., Next.js, Angular)
      - name: Build application
        run: npm run build

      - name: Deploy to Firebase App Hosting
        run: firebase deploy --only apphosting --project devtest
        env:
          # Pass the service account key as an environment variable
          # The Firebase CLI automatically looks for GOOGLE_APPLICATION_CREDENTIALS
          # Replace with your actual secret name if different
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SNAPMEAL_SA2E9 }}
          # It's also good practice to provide the project ID explicitly
          FIREBASE_PROJECT_ID: snapmeal-sa2e9 # Replace with your actual Firebase Project ID
